name: leak-check

# CI runs on the Human's own machine: a self-hosted Windows runner (the repository is private, so GitHub-hosted
# minutes would be billed). A pull request runs leak-check and kit-tests; a release tag also runs e2e; any job can be
# started by hand from the Actions tab. A push to main runs nothing: its pull request already ran the checks.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The checks only read the repository.
permissions:
  contents: read

# A newer commit on the same branch/PR cancels the run it makes stale (never on a tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner's service account has no git identity; the fixture repositories the checks create commit with this one.
env:
  GIT_AUTHOR_NAME: kit-ci
  GIT_AUTHOR_EMAIL: kit-ci@example.invalid
  GIT_COMMITTER_NAME: kit-ci
  GIT_COMMITTER_EMAIL: kit-ci@example.invalid

# Git Bash, not the WSL bash.exe in System32: the first step of each job puts Git's bin folder first on PATH.
defaults:
  run:
    shell: bash

jobs:
  leak-check:
    # Never code from a fork on the Human's machine: a pull request runs only when its branch is in this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git Bash first on PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'; Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: Core, layers and templates must not name a framework, stack or project
        run: node tools/leak-check.mjs
      - name: Packs must not name the project
        run: node tools/leak-check.mjs --root packs --project-only
      # docs/agent/ is not scanned here: it is the kit's installed copy of core/docs/agent (rendered with the kit's own
      # .kit/config.json values), and core/ is scanned in full by the first step.
      - name: README, CHANGELOG and the kit's own docs must not name the project
        run: node tools/leak-check.mjs --root README.md --root CHANGELOG.md --root docs/CHANGE-LOOP.md --root docs/project --root docs/brain --project-only
      - name: Mods must not name the project (their tests are fixtures and are not scanned)
        run: node tools/leak-check.mjs --root mods/README.md --root mods/SECURITY.md --root mods/fleet/hooks --root mods/guards/hooks --root mods/ship-pilot/hooks --root mods/fleet/.claude-plugin/plugin.json --root mods/guards/.claude-plugin/plugin.json --root mods/ship-pilot/.claude-plugin/plugin.json --root .claude-plugin --project-only
      - name: Packs must satisfy the pack contract
        run: node tools/pack-check.mjs
      # The kit is installed into itself (.kit/config.json): a change to core/, packs/, layers/ or templates/ must come
      # with `node tools/sync.mjs --target . --apply` in the same PR.
      - name: The kit's installed copy equals its sources
        run: node tools/drift-check.mjs --target .
      # actionlint, pinned by version and checksum, lints every workflow install-check renders.
      - name: Install actionlint (pinned)
        shell: powershell
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 7f12f1801bca3d480d67aaf7774f4c2a6359a3ca8eebe382c95c10c9704aa731
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $zip "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$($env:ACTIONLINT_VERSION)_windows_amd64.zip"
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() -ne $env:ACTIONLINT_SHA256) { throw 'actionlint checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'actionlint'
          Expand-Archive -Force -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_ENV -Value "ACTIONLINT=$dir\actionlint.exe"
      - name: Installer and sync install a working project (fixtures; rendered workflows pass actionlint)
        env:
          KIT_REQUIRE_ACTIONLINT: '1'
        run: node tools/install-check.mjs
      - name: Every path the installed workflow docs name exists (packs [], angular, node-express, both, react-vite, react-vite + layers)
        run: node tools/workflow-link-check.mjs

  kit-tests:
    # Every kit tool test once per pull request, in its own job beside leak-check so the PR does not wait longer
    # (plan 075). Local runs keep to the checks CI does not cover (docs/CHANGE-LOOP.md section 1).
    # Never code from a fork on the Human's machine (see leak-check).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git Bash first on PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'; Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      # The workflow scripts import picomatch (scripts/package.json).
      - name: Install the workflow scripts' packages
        run: npm ci --prefix scripts
      - name: Every kit tool test (node --test tools/test)
        run: node --test "tools/test/*.test.mjs"
      # The orchestrator's behaviours of plans 100–104, each staged in a sandbox with the fake builder; any FAIL fails
      # the job (docs/agent/kit-validation.md).
      - name: Orchestrator validation, fake mode (tools/validate-orchestrator.mjs)
        run: node tools/validate-orchestrator.mjs --mode fake

  e2e:
    # A fresh project taken through plan -> take-plan -> ship -> merge -> close-out (tools/e2e-check.mjs). Release tags
    # and hand-started runs only: projects take released versions, and kit-tests covers each pull request.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git Bash first on PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'; Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: End-to-end workflow cycle in a fresh project
        run: node tools/e2e-check.mjs
      # Fixture projects (Angular + Express, React-Vite + Supabase, an upstream-owned React-Vite copy): stack detection,
      # install, link check, drift-check, rendered CI, adoption report, first commit through the hooks, then
      # e2e-check --project on the two React-Vite fixtures (Vite slot server, /pull-copy, Planner close-out).
      - name: Acceptance on fixture projects (+ e2e --project)
        run: node tools/acceptance-check.mjs --e2e
