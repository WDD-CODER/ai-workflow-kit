name: leak-check

on:
  push:
  pull_request:

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core, layers and templates must not name a framework, stack or project
        run: node tools/leak-check.mjs
      - name: Packs must not name the project
        run: node tools/leak-check.mjs --root packs --project-only
      - name: README and CHANGELOG must not name the project
        run: node tools/leak-check.mjs --root README.md --root CHANGELOG.md --root docs --project-only
      - name: Packs must satisfy the pack contract
        run: node tools/pack-check.mjs
      - name: Installer and sync install a working project (three fixtures)
        run: node tools/install-check.mjs

  e2e:
    # A fresh project taken through plan -> take-plan -> ship -> merge -> close-out (tools/e2e-check.mjs).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: End-to-end workflow cycle in a fresh project
        shell: bash
        run: node tools/e2e-check.mjs
