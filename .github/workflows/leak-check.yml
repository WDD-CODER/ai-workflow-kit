name: leak-check

on:
  # A branch is checked once, by its pull request; `main` and release tags are checked after the merge.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer commit on the same branch/PR cancels the run it makes stale (never on `main` or a tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core, layers and templates must not name a framework, stack or project
        run: node tools/leak-check.mjs
      - name: Packs must not name the project
        run: node tools/leak-check.mjs --root packs --project-only
      # docs/agent/ is not scanned here: it is the kit's installed copy of core/docs/agent (rendered with the kit's own
      # .kit/config.json values), and core/ is scanned in full by the first step.
      - name: README, CHANGELOG and the kit's own docs must not name the project
        run: node tools/leak-check.mjs --root README.md --root CHANGELOG.md --root docs/CHANGE-LOOP.md --root docs/project --root docs/brain --project-only
      - name: Mods must not name the project (their tests are fixtures and are not scanned)
        run: node tools/leak-check.mjs --root mods/README.md --root mods/SECURITY.md --root mods/fleet/hooks --root mods/guards/hooks --root mods/ship-pilot/hooks --root mods/fleet/.claude-plugin/plugin.json --root mods/guards/.claude-plugin/plugin.json --root mods/ship-pilot/.claude-plugin/plugin.json --root .claude-plugin --project-only
      - name: Packs must satisfy the pack contract
        run: node tools/pack-check.mjs
      # The kit is installed into itself (.kit/config.json): a change to core/, packs/, layers/ or templates/ must come
      # with `node tools/sync.mjs --target . --apply` in the same PR.
      - name: The kit's installed copy equals its sources
        run: node tools/drift-check.mjs --target .
      # actionlint, pinned by version and checksum, lints every workflow install-check renders.
      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "ACTIONLINT=$RUNNER_TEMP/actionlint/actionlint" >> "$GITHUB_ENV"
      - name: Installer and sync install a working project (fixtures; rendered workflows pass actionlint)
        env:
          KIT_REQUIRE_ACTIONLINT: '1'
        run: node tools/install-check.mjs
      - name: Every path the installed workflow docs name exists (packs [], angular, node-express, both, react-vite, react-vite + layers)
        run: node tools/workflow-link-check.mjs

  e2e:
    # A fresh project taken through plan -> take-plan -> ship -> merge -> close-out (tools/e2e-check.mjs).
    strategy:
      fail-fast: false
      matrix:
        # Windows is the slow leg (~4 min vs ~1 min): a pull request runs Ubuntu only, `main` and tags run both.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: End-to-end workflow cycle in a fresh project
        shell: bash
        run: node tools/e2e-check.mjs
      # Fixture projects (Angular + Express, React-Vite + Supabase, an upstream-owned React-Vite copy): stack detection,
      # install, link check, drift-check, rendered CI, adoption report, first commit through the hooks, then
      # e2e-check --project on the two React-Vite fixtures (Vite slot server, /pull-copy, Planner close-out).
      - name: Acceptance on fixture projects (+ e2e --project)
        shell: bash
        run: node tools/acceptance-check.mjs --e2e
