name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  security:
    # The todo-sync bot's ledger PRs only touch .claude/ — nothing to audit. Skip only when the
    # bot opened the PR from this repo, so naming a branch chore/todo-sync-* can't dodge the audit.
    if: >
      !(startsWith(github.head_ref, 'chore/todo-sync-') &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
# KIT:if project.packageManager=pnpm
      - uses: pnpm/action-setup@v4
# KIT:end
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: {{project.packageManager}}
      - name: Install root
        run: {{ci.install}}
# KIT:if paths.serverRoot
      - name: Install server
        run: {{ci.install}}
        working-directory: {{paths.serverRoot}}
# KIT:end
# KIT:if ci.appAuditMode=report
      # ci.appAuditMode "report": advisories in dependencies the project cannot fix (e.g. an upstream
      # lockfile) go to the job summary and a warning; this step never fails the workflow.
      - name: npm audit (report only)
        shell: bash
        run: |
          # GitHub runs bash with -e: without set +e the first finding would end the step before the summary.
          set +e
          for dir in . {{paths.serverRoot}}; do
# KIT:if project.packageManager=pnpm
            out="$(cd "$dir" && pnpm audit --prod 2>&1)"
# KIT:else
            out="$(cd "$dir" && npm audit --omit=dev 2>&1)"
# KIT:end
            code=$?
            if [[ $code -ne 0 ]]; then
              echo "::warning title=npm audit (${dir})::production advisories found (report only, ci.appAuditMode=report); see the job summary"
            fi
            {
              echo "### npm audit (${dir}) — report only, exit ${code}"
              echo '```'
              echo "$out" | tail -n 80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0
# KIT:else
      # --omit=dev: devDependencies are build/dev-server tooling ({{stack.name}} CLI, vite,
      # webpack-dev-server, ...) that never ships to production, so their audit
      # findings are noise for this app's real attack surface — permanent, not a
      # workaround. --audit-level=critical stays until a framework major-version upgrade
      # (tracked in .claude/todo.md) clears the current framework-package high findings;
      # restore --audit-level=high on production deps after that migration lands.
      # The audit renders by project.packageManager: pnpm audit --prod reads pnpm-lock.yaml (npm audit fails
      # without a package-lock.json). The step names stay "npm audit" so pr-check-fix-loop.md finds them.
      - name: npm audit (root)
# KIT:if project.packageManager=pnpm
        run: pnpm audit --prod --audit-level critical
# KIT:else
        run: npm audit --omit=dev --audit-level=critical
# KIT:end
# KIT:if paths.serverRoot
      - name: npm audit (server)
# KIT:if project.packageManager=pnpm
        run: pnpm audit --prod --audit-level critical
# KIT:else
        run: npm audit --omit=dev --audit-level=critical
# KIT:end
        working-directory: {{paths.serverRoot}}
# KIT:end
# KIT:end
      # The workflow scripts' own dependencies (scripts/package.json) are kit-managed: a kit release fixes
      # them, not the project, so their audit is reported (job summary + warning) and never fails the job.
# KIT:required — a project override must keep this step
      - name: npm audit (workflow scripts, report only)
        if: hashFiles('scripts/package-lock.json') != ''
        shell: bash
        working-directory: scripts
        run: |
          # GitHub runs bash with -e: without set +e the first finding would end the step before the summary.
          set +e
          out="$(npm audit --omit=dev 2>&1)"
          code=$?
          if [[ $code -ne 0 ]]; then
            echo "::warning title=npm audit (workflow scripts)::advisories in the kit-managed scripts/ dependencies; a kit release fixes them (kit-sync), see the job summary"
          fi
          {
            echo "### npm audit (scripts/, kit-managed) — report only, exit ${code}"
            echo '```'
            echo "$out" | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
# KIT:required — a project override must keep this step
      - name: Semgrep OWASP Top Ten
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
