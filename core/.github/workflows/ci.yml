name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-gates: ${{ steps.detect.outputs.run-gates }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect app/code changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run-gates=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: running full gates"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t FILES < <(git diff --name-only "$BASE" "$HEAD")

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "run-gates=true" >> "$GITHUB_OUTPUT"
            echo "No files listed; running full gates (safe default)"
            exit 0
          fi

          run_gates=false
          for f in "${FILES[@]}"; do
            case "$f" in
              docs/*|plans/*|sessions/*|notes/*|bugs/*|archive/*|.claude/*|.cursor/*|*.md)
                ;;
              *)
                run_gates=true
                break
                ;;
            esac
          done

          echo "run-gates=${run_gates}" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '%s\n' "${FILES[@]}"
          echo "Decision: run-gates=${run_gates}"

  lint:
    needs: changes
    if: needs.changes.outputs.run-gates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
# KIT:if ci.lintScope=changed
        with:
          fetch-depth: 0
# KIT:end
# KIT:if project.packageManager=pnpm
      - uses: pnpm/action-setup@v4
# KIT:end
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: {{project.packageManager}}
      - name: Install
        run: {{ci.install}}
# KIT:if ci.lintScope=changed
      # ci.lintScope "changed": lint only the files this change touches, so lint debt the project does not
      # own (e.g. upstream code) cannot keep CI red. A PR compares its merge commit with the base side
      # (HEAD^1); a push with the commit before it (a new branch: the parent commit); nothing to compare
      # with = nothing to lint. Kit-managed files (.kit/install.json) are the kit's, not the project's lint.
      - name: ESLint (changed files)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$(git rev-parse --verify 'HEAD^1')"
          else
            BASE="$PUSH_BEFORE"
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse -q --verify 'HEAD~1' || true)"
            fi
          fi
          if [[ -z "$BASE" ]]; then
            echo "No commit to compare with: nothing to lint"
            exit 0
          fi
          # A file, so a failing git diff fails the step (a process substitution would hide its exit status).
          LIST="$RUNNER_TEMP/changed-files"
          git -c core.quotePath=false diff -z --name-only --diff-filter=d "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' > "$LIST"
          KIT_FILES=""
          if [[ -f .kit/install.json ]]; then
            KIT_FILES="$(node -p "Object.keys(require('./.kit/install.json').files || {}).join('\n')")"
          fi
          declare -A KIT=()
          while IFS= read -r p; do
            [[ -n "$p" ]] && KIT["$p"]=1
          done <<< "$KIT_FILES"
          FILES=()
          while IFS= read -r -d '' f; do
            [[ -n "${KIT[$f]:-}" ]] || FILES+=("$f")
          done < "$LIST"
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No changed .ts/.tsx/.js/.jsx/.mjs/.cjs files of the project's own: nothing to lint"
            exit 0
          fi
          printf 'Linting %s\n' "${FILES[@]}"
          npx --no-install eslint --no-error-on-unmatched-pattern "${FILES[@]}"
# KIT:else
      - name: ESLint
        run: {{project.packageManager}} run {{commands.lint}}
# KIT:end
      # The workflow scripts' own dependencies live in scripts/package.json (kit-managed); install them
      # inside scripts/ (not with --prefix) before anything runs those scripts.
# KIT:required — a project override must keep this step
      - name: Install workflow script dependencies
        if: hashFiles('scripts/package-lock.json') != ''
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      # A project that overrides this workflow keeps its own copy: this step fails by name when that copy
      # lost a step the kit requires, instead of the loss surfacing as a broken script later.
# KIT:required — a project override must keep this step
      - name: Kit override check
        run: node scripts/override-check.mjs
# KIT:required — a project override must keep this step
      - name: Workflow script tests
# KIT:if project.packageManager=pnpm
        run: pnpm run --if-present test:scripts
# KIT:else
        run: npm run test:scripts --if-present
# KIT:end

  build:
    needs: changes
    if: needs.changes.outputs.run-gates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
# KIT:if project.packageManager=pnpm
      - uses: pnpm/action-setup@v4
# KIT:end
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: {{project.packageManager}}
      # <!-- PACK:stack — build cache step (framework cache dir) comes from the stack pack -->
      - name: Install
        run: {{ci.install}}
      - name: Build
        run: {{project.packageManager}} run {{commands.build}}
# KIT:if ci.testMode!=skip

  test:
    needs: changes
    if: needs.changes.outputs.run-gates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
# KIT:if project.packageManager=pnpm
      - uses: pnpm/action-setup@v4
# KIT:end
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: {{project.packageManager}}
      # <!-- PACK:stack — build cache step (framework cache dir) comes from the stack pack -->
      - name: Install
        run: {{ci.install}}
      - name: Unit tests
# KIT:if ci.testMode=if-present
        run: {{project.packageManager}} run --if-present {{commands.test}}
# KIT:else
        run: {{project.packageManager}} run {{commands.test}}
# KIT:end
# KIT:end
# KIT:if paths.serverRoot

  # The backend's own tests: only when the project has one (paths.serverRoot).
  server-tests:
    needs: changes
    if: needs.changes.outputs.run-gates == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: {{paths.serverRoot}}
    steps:
      - uses: actions/checkout@v4
# KIT:if project.packageManager=pnpm
      - uses: pnpm/action-setup@v4
# KIT:end
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: {{project.packageManager}}
# KIT:if project.packageManager=pnpm
          cache-dependency-path: {{paths.serverRoot}}pnpm-lock.yaml
# KIT:else
          cache-dependency-path: {{paths.serverRoot}}package-lock.json
# KIT:end
      - name: Install
        run: {{ci.install}}
      - name: Server tests
        run: {{project.packageManager}} test
# KIT:end

  gitleaks:
    runs-on: ubuntu-latest
    # The default token may be read-only; the action reads the PR's commits and must not post comments.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
# KIT:required — a project override must keep this step
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  ci:
    needs:
      - changes
      - lint
      - build
# KIT:if ci.testMode!=skip
      - test
# KIT:end
# KIT:if paths.serverRoot
      - server-tests
# KIT:end
      - gitleaks
    if: always()
    runs-on: ubuntu-latest
    steps:
# KIT:required — a project override must keep this step
      - name: Require quality gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes job failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            echo "gitleaks failed: ${{ needs.gitleaks.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run-gates }}" == "true" ]]; then
            if [[ "${{ needs.lint.result }}" != "success" ]]; then
              echo "lint failed: ${{ needs.lint.result }}"
              exit 1
            fi
            if [[ "${{ needs.build.result }}" != "success" ]]; then
              echo "build failed: ${{ needs.build.result }}"
              exit 1
            fi
# KIT:if ci.testMode!=skip
            if [[ "${{ needs.test.result }}" != "success" ]]; then
              echo "test failed: ${{ needs.test.result }}"
              exit 1
            fi
# KIT:end
# KIT:if paths.serverRoot
            if [[ "${{ needs.server-tests.result }}" != "success" ]]; then
              echo "server-tests failed: ${{ needs.server-tests.result }}"
              exit 1
            fi
# KIT:end
            echo "All quality gates passed"
          else
            echo "Docs-only PR: lint/build/test skipped; gitleaks passed"
          fi
